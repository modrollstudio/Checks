plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

// Gametest delegators live here, not in main: in the release fabric.mod.json they would break consumers,
// since the shared *Scenarios bodies they call are not in the jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
    uishots {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Plain implementation: dev runs want common's named classes, which Loom would otherwise remap; the jar
    // bundles and remaps them below.
    implementation project(':common')

    gametestImplementation project(':common').sourceSets.gametest.output
    uishotsImplementation project(':common').sourceSets.uishots.output

    modImplementation critfall('fabric')

    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
}

def gameTestDir = 'run-gametest'
def uiShotsDir = 'run-uishots'
def uiShotsOutput = rootProject.file('design/screenshots/fabric')

loom {
    runs {
        server {
            server()
            ideConfigGenerated = true
        }
        client {
            client()
            programArgs '--username', 'Dev1'
        }
        // Second client for two player playtests: its own directory, so the two don't share a session lock.
        client2 {
            client()
            name = 'Minecraft Client 2'
            runDir = 'run2'
            programArgs '--username', 'Dev2'
            ideConfigGenerated = true
        }
        gametest {
            server()
            name = 'Game Test'
            runDir = gameTestDir
            source sourceSets.gametest
            property 'fabric-api.gametest'
            property 'fabric-api.gametest.report-file', "${project.buildDir}/junit.xml"
            ideConfigGenerated = true
        }
        uiShots {
            client()
            name = 'UI Shots'
            runDir = uiShotsDir
            source sourceSets.uishots
            programArgs '--username', 'Dev1', '--width', '1920', '--height', '1080'
            property 'checks.uishots.dir', uiShotsOutput.absolutePath
        }
    }
}

// Common's classes are bundled for remapJar; its resources come through processResources, so not twice.
jar {
    from project(':common').sourceSets.main.output.classesDirs
}

processResources {
    from project(':common').sourceSets.main.resources

    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_issue_tracker      : mod_issue_tracker,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version  : fabric_loader_version,
            critfall_min_version   : critfall_min_version,
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand props
    }
}

def wipeGameTestWorld = tasks.register('wipeGameTestWorld', Delete) {
    delete file("${gameTestDir}/world")
}
tasks.matching { it.name == 'runGametest' }.configureEach { dependsOn wipeGameTestWorld }

def wipeUiShots = tasks.register('wipeUiShots', Delete) {
    delete file("${uiShotsDir}/saves"), uiShotsOutput
}
tasks.matching { it.name == 'runUiShots' }.configureEach { dependsOn wipeUiShots }

// Nothing in the build graph compiles the uishots source set otherwise; keep `check` catching it.
tasks.named('check') { dependsOn tasks.named('uishotsClasses') }
