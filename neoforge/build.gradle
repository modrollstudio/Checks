plugins {
    id 'net.neoforged.moddev'
}

// GameTest registration shims and their structure template: dev runs only, never shipped.
sourceSets {
    gametest
    uishots
}

def gameTestDir = file('run-gametest')
def uiShotsDir = file('run-uishots')
def uiShotsOutput = rootProject.file('design/screenshots/neoforge')

neoForge {
    version = neoforge_version

    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.uishots

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }
        // Second client for two-player playtests: its own game directory so the two do not share
        // a session lock, and its own name so checks can tell them apart.
        client2 {
            client()
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = file('run2')
        }
        server {
            server()
        }
        // Its own game directory, its world wiped before every run, so test worlds never pile up and the
        // dev server's world in run/ is left alone.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = gameTestDir
        }
        // Dev-only screenshot run: saves every Checks screen to design/screenshots/neoforge, then quits.
        // The output property is what switches the driver on, so other runs that load it stay untouched.
        uiShots {
            client()
            programArguments.addAll '--username', 'Dev1', '--width', '1920', '--height', '1080'
            gameDirectory = uiShotsDir
            systemProperty 'checks.uishots.dir', uiShotsOutput.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            // Shared GameTest bodies — loaded on the gameTestServer run, not shipped in the jar.
            sourceSet project(':common').sourceSets.gametest
            sourceSet sourceSets.gametest
            // The screenshot driver — dev runs only, not shipped in the jar.
            sourceSet project(':common').sourceSets.uishots
            sourceSet sourceSets.uishots
        }
    }
}

dependencies {
    compileOnly project(':common')

    gametestCompileOnly project(':common')
    // The gametest delegators compile against the shared *Scenarios classes.
    gametestCompileOnly project(':common').sourceSets.gametest.output

    uishotsCompileOnly project(':common')
    uishotsCompileOnly project(':common').sourceSets.uishots.output

    // Critfall consumed as a published Modrinth artifact; implementation puts it on the dev-run
    // runtime classpath so FML loads it as a mod in runClient/gameTestServer.
    implementation "maven.modrinth:critfall:${critfall_neoforge_modrinth_id}"
}

def wipeGameTestWorld = tasks.register('wipeGameTestWorld', Delete) {
    delete new File(gameTestDir, 'world')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn wipeGameTestWorld }

// A fresh world and no stale screenshots on every run.
def wipeUiShots = tasks.register('wipeUiShots', Delete) {
    delete new File(uiShotsDir, 'saves'), uiShotsOutput
}
tasks.matching { it.name == 'runUiShots' }.configureEach { dependsOn wipeUiShots }

// Nothing in the build graph compiles the gametest or uishots source sets otherwise; keep `check` catching them.
tasks.named('check') { dependsOn tasks.named('gametestClasses'), tasks.named('uishotsClasses') }

// Bundle common's compiled classes into the NeoForge jar. Common's resources come through
// processResources below (with property expansion) — bundling output too would duplicate them.
jar {
    from project(':common').sourceSets.main.output.classesDirs
}

processResources {
    from project(':common').sourceSets.main.resources

    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_issue_tracker      : mod_issue_tracker,
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range : neoforge_version_range,
            critfall_version_range : critfall_version_range,
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}
