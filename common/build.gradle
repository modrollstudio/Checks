plugins {
    id 'net.neoforged.moddev'
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    uishots {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Vanilla Minecraft (Mojang mappings) without any loader: code here must stay loader agnostic.
neoForge {
    neoFormVersion = neoform_version
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.uishots
}

// Modrinth has no loader agnostic Critfall jar, and only the NeoForge one keeps Mojang names for its API.
dependencies {
    compileOnly critfall('neoforge')
    testImplementation critfall('neoforge')
    gametestCompileOnly critfall('neoforge')
}

processResources {
    def props = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_version    : mod_version,
            mod_description: mod_description,
    ]
    inputs.properties props
    filesMatching('pack.mcmeta') {
        expand props
    }
}
