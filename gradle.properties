org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

mod_id=checks
mod_name=Critfall: Checks
mod_version=0.2.3
mod_group=studio.modroll.checks
mod_authors=Modroll Studio
mod_description=Ability scores, skills and saves for Minecraft, built on Critfall's d20 engine.
mod_license=MIT
mod_issue_tracker=https://github.com/modrollstudio/Checks/issues

# Bump the Critfall Modrinth ids only when Checks needs something from a newer Critfall.
# critfall_from_maven_local=true builds against ~/.m2, only for an unreleased Critfall; keep it false for a release.
critfall_from_maven_local=false
critfall_version=0.2.20
critfall_neoforge_modrinth_id=uuTghaUt
critfall_fabric_modrinth_id=ZKGwhYf1
critfall_min_version=0.2.20
critfall_version_range=[0.2.20,)

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.235
neoforge_version_range=[21.1.0,)

fabric_loom_version=1.9-SNAPSHOT
fabric_loader_version=0.16.9
fabric_api_version=0.109.0+1.21.1
# Dev runs only. 0.6.13 is the newest 1.21.1 Sodium build Loom 1.9 can remap (0.8.x needs Loom 1.16).
sodium_version=mc1.21.1-0.6.13-fabric

java_version=21
junit_version=5.11.4
